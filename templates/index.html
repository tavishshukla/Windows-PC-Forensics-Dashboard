<!doctype html><html><head><meta charset="utf-8"><title>PC Forensics</title><link rel="stylesheet" href="/static/style.css"></head><body><header><h1>PC FORENSICS DASHBOARD</h1><span>● READ-ONLY LOCAL MONITOR</span><p id="host"></p></header><main><div id="stats"></div><section><h2>Top Processes</h2><table><thead><tr><th>PID</th><th>Process</th><th>User</th><th>RAM</th><th>Status</th><th>Path</th></tr></thead><tbody id="procs"></tbody></table></section><section><h2>Network Connections</h2><table><thead><tr><th>PID</th><th>Local</th><th>Remote</th><th>Status</th></tr></thead><tbody id="net"></tbody></table></section></main><script>const e=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function load(){let x=await fetch("/api/snapshot").then(r=>r.json());document.getElementById("host").textContent=x.host+" • "+x.os;document.getElementById("stats").innerHTML=["CPU "+x.cpu+"%","RAM "+x.memory+"%","DISK "+x.disk+"%","PROCESSES "+x.processes.length,"CONNECTIONS "+x.connections.length].map(v=>"<b>"+v+"</b>").join("");document.getElementById("procs").innerHTML=x.processes.map(p=>"<tr><td>"+p.pid+"</td><td>"+e(p.name)+"</td><td>"+e(p.user)+"</td><td>"+p.ram_mb+" MB</td><td>"+e(p.status)+"</td><td>"+e(p.exe)+"</td></tr>").join("");document.getElementById("net").innerHTML=x.connections.map(c=>"<tr><td>"+(c.pid??"")+"</td><td>"+e(c.local)+"</td><td>"+e(c.remote)+"</td><td>"+e(c.status)+"</td></tr>").join("")}load();setInterval(load,3000)</script></body></html>
